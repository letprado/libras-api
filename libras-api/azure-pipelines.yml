trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: JavaToolInstaller@0
  displayName: 'Configurar Java 17'
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- task: Maven@4
  displayName: 'Build da API (Ignorando Testes)'
  inputs:
    mavenPomFile: 'libras-api/pom.xml'
    mavenOptions: '-Xmx3072m'
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '17'
    jdkArchitectureOption: 'x64'
    publishJUnitResults: false
    goals: 'clean package -DskipTests'

# --- NOVAS ETAPAS ADICIONADAS ABAIXO ---

- task: CopyFiles@2
  displayName: 'Copiar o pacote gerado (.jar)'
  inputs:
    SourceFolder: '$(system.defaultworkingdirectory)/libras-api/target'
    Contents: '*.jar'
    TargetFolder: '$(build.artifactstagingdirectory)'

- task: PublishBuildArtifacts@1
  displayName: 'Publicar o Artefato (Drop)'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
